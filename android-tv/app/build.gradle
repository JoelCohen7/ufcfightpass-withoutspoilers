plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joelcohen.withoutspoilers'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joelcohen.withoutspoilers'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The repo's userscript (one level up) is copied into the assets on every build.
tasks.register('copyUserscript', Copy) {
    from "${rootDir}/../ufcfightpass-withoutspoilers.user.js"
    into "${projectDir}/src/main/assets"
}
preBuild.dependsOn copyUserscript

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
